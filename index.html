<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do Dil Ek Jaan ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #4b164c, #160018 55%, #050005);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 24px;
      animation: float 7s linear infinite;
      opacity: 0.5;
    }

    .heart:nth-child(1) { left: 10%; animation-delay: 0s; }
    .heart:nth-child(2) { left: 30%; animation-delay: 2s; }
    .heart:nth-child(3) { left: 55%; animation-delay: 4s; }
    .heart:nth-child(4) { left: 80%; animation-delay: 1s; }

    @keyframes float {
      0% {
        transform: translateY(110vh) scale(0.7);
        opacity: 0;
      }
      20% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-20vh) scale(1.3);
        opacity: 0;
      }
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 45px rgba(255, 0, 150, 0.25);
      position: relative;
      z-index: 2;
    }

    .logo {
      font-size: 65px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 35px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ff6bcb, #ffffff, #ff4f9a);
      -webkit-background-clip: text;
      color: transparent;
    }

    .tagline {
      color: #e7cce5;
      margin-bottom: 30px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #ff3f9f, #a52cff);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 0, 150, 0.3);
    }

    button:active {
      transform: scale(0.97);
    }

    .small {
      margin-top: 18px;
      color: #bda9bb;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="hearts">
    <div class="heart">❤️</div>
    <div class="heart">💗</div>
    <div class="heart">💖</div>
    <div class="heart">💕</div>
  </div>

  <div class="card">
    <div class="logo">❤️</div>

    <h1>Do Dil Ek Jaan</h1>

    <p class="tagline">
      Connect • Chat • Share • Play
    </p>

    <button onclick="startApp()">
      Enter Do Dil Ek Jaan
    </button>

    <p class="small">
      Made with ❤️ for connections that matter
    </p>
  </div>

  <script>
    function startApp() {
      alert("Welcome to Do Dil Ek Jaan ❤️");
    }
  </script>

</body>
</html>
