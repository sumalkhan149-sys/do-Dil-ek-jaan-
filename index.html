<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Dil Ek Jaan ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:#000}
button,input,textarea{font:inherit}button{border:0;border-radius:28px;padding:11px 14px;color:#fff;background:linear-gradient(90deg,#ff3f9f,#a52cff);font-weight:bold;cursor:pointer}
input,textarea{width:100%;padding:12px;border:1px solid #ffffff2b;border-radius:12px;background:#ffffff12;color:#fff;outline:none;margin:6px 0}
.app{max-width:500px;min-height:100vh;margin:auto;padding:16px 12px 90px;background:radial-gradient(circle at top,#58145b,#180018 55%,#050005)}
.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,#58145b,#180018 55%,#050005)}
.card,.panel{background:#ffffff0d;border:1px solid #ffffff20;border-radius:20px;padding:18px;margin:10px 0}
.screen{display:none}.screen.active{display:block}.top-title{font-size:24px;font-weight:bold;margin:6px 0 14px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:68px;display:flex;justify-content:space-around;align-items:center;background:#140014f5;border-top:1px solid #ffffff20;z-index:10}
.nav-btn{width:16%;background:none;padding:5px 1px;color:#bdaabd;font-size:10px}.nav-btn.active{color:#ff69bd}.nav-icon{display:block;font-size:19px;margin-bottom:2px}
.profile-pic{width:100px;height:100px;object-fit:cover;border-radius:50%;border:3px solid #ff70c8;margin-bottom:10px}.muted{color:#d8bfd6}.small{font-size:11px;color:#cdb9cb}
.code{font-size:26px;letter-spacing:3px;color:#ff69bd;font-weight:bold;text-align:center;margin:8px 0}.secondary{background:#ffffff20}
.post-card,.friend-card,.request-card{padding:13px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff0b;margin:10px 0;overflow-wrap:anywhere}
.post-media{width:100%;max-height:360px;object-fit:cover;border-radius:12px;margin-top:8px}.media-preview{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin:8px 0;display:none;border:1px solid #ffffff20}.media-row{display:flex;gap:6px}
.post-actions{display:flex;gap:6px;margin-top:10px}.action-btn{flex:1;padding:8px;font-size:13px;background:#ffffff18;border-radius:12px}.action-btn.liked{background:linear-gradient(90deg,#ff3f9f,#a52cff)}
.status{font-size:12px;color:#ffd5ed;margin-top:6px}
.comments-box{margin-top:10px;padding-top:10px;border-top:1px solid #ffffff15;display:none}.comments-box.active{display:block}
.comment{font-size:12px;margin:6px 0;background:#ffffff12;padding:7px 10px;border-radius:10px}.comment b{color:#ffb7df}
.reels-container{height: calc(100vh - 150px);overflow-y:scroll;scroll-snap-type: y mandatory;}
.reel-item{height: calc(100vh - 160px);scroll-snap-align:start;position:relative;background:#000;border-radius:20px;overflow:hidden;margin:12px 0;border:1px solid #ffffff20;display:flex;flex-direction:column;justify-content:flex-end}
.reel-video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.reel-overlay{position:absolute;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(transparent, #000000e0);z-index:1}
.reel-actions{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:10px;z-index:2}
.reel-action-btn{width:48px;height:52px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffff20;font-size:20px;padding:0}
.reel-action-btn span{font-size:9px;margin-top:2px}
.reel-comments{position:absolute;bottom:0;left:0;right:0;max-height:55%;background:#111111f5;border-top-left-radius:20px;border-top-right-radius:20px;padding:14px;z-index:3;display:none;overflow-y:auto;border:1px solid #ffffff20}
.reel-comments.active{display:block}
</style>
</head>
<body>
<div id="loginScreen" class="login"><div class="card" style="text-align:center;max-width:400px;width:100%"><div style="font-size:55px">❤️</div><h1>Do Dil Ek Jaan</h1><p class="muted">Posts • Reels • Friends</p><button id="loginBtn" style="margin-top:15px">Continue with Google</button><p id="loginStatus" class="status"></p></div></div>
<div id="app" class="app hidden">
<section id="homeScreen" class="screen active"><div class="top-title">Do Dil Ek Jaan ❤️</div><div class="panel"><h2 id="homeWelcome">Welcome! 💕</h2></div></section>
<section id="postsScreen" class="screen"><div class="top-title">📝 Posts</div><div class="panel"><textarea id="postText" rows="3" placeholder="Kya haal hai? ✨"></textarea><input id="postMediaInput" type="file" accept="image/*" class="hidden"><img id="mediaPreviewImg" class="media-preview"><div class="media-row"><button id="selectMediaBtn" class="secondary">📷 Photo</button><button id="removeMediaBtn" class="secondary hidden">❌</button></div><button id="publishPostBtn">📝 Post Karo</button><div id="postStatus" class="status"></div></div><div id="postsFeed"></div></section>
<section id="reelsScreen" class="screen"><div class="top-title">🎬 Reels</div><div class="panel"><textarea id="reelCaption" rows="2" placeholder="Caption..."></textarea><input id="reelInput" type="file" accept="video/*" class="hidden"><video id="reelPreview" class="media-preview" controls></video><div class="media-row"><button id="selectReelBtn" class="secondary">🎥 Reel Select</button><button id="removeReelBtn" class="secondary hidden">❌</button></div><button id="publishReelBtn">⬆️ Reel Upload</button><div id="reelStatus" class="status"></div></div><div id="reelsFeed" class="reels-container"></div></section>
<section id="friendsScreen" class="screen"><div class="top-title">👥 Friends</div><div class="panel"><div id="myFriendCode" class="code">--------</div><button id="copyCodeBtn" class="secondary">Copy Code</button></div><div class="panel"><h2>Requests</h2><div id="requestList"></div></div><div class="panel"><h2>Friends</h2><div id="friendsList"></div></div><div class="panel"><input id="friendSearchInput" maxlength="8" placeholder="FRIEND CODE"><button id="searchFriendBtn">Search</button><div id="friendResult"></div></div></section>
<section id="chatScreen" class="screen"><div class="top-title">💬 Chat</div><div id="privateChatHeader" class="panel hidden"><div id="privateFriendName" style="font-weight:bold">Friend</div><button id="backToFriendsBtn" class="secondary" style="margin-top:6px">← Back</button></div><div id="chatBox" style="height:50vh;overflow-y:auto;padding:12px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff08;margin:10px 0"></div><div style="display:flex;gap:6px"><input id="chatInput" placeholder="Message..."><button id="sendBtn" style="width:70px">Send</button></div></section>
<section id="profileScreen" class="screen"><div class="top-title">👤 Profile</div><div class="panel" style="text-align:center"><img id="profilePic" class="profile-pic"><input id="photoInput" type="file" accept="image/*" class="hidden"><img id="profilePreview" class="media-preview" style="margin:8px auto;max-width:200px"><button id="changePhotoBtn" class="secondary">Select Photo</button><button id="uploadPhotoBtn" class="hidden">Upload</button><p id="photoStatus" class="status"></p><h2 id="userName">User</h2><p id="userEmail" class="small"></p><p id="userBio" class="muted"></p><div id="editBox" class="hidden"><input id="nameInput"><textarea id="bioInput" rows="2"></textarea><button id="saveBtn">Save</button><button id="cancelBtn" class="secondary">Cancel</button></div><button id="editBtn" class="secondary">Edit</button><button id="logoutBtn" class="secondary" style="background:#ff3264">Logout</button></div></section>
<nav class="bottom-nav">
<button class="nav-btn active" data-screen="homeScreen"><span class="nav-icon">🏠</span>Home</button>
<button class="nav-btn" data-screen="postsScreen"><span class="nav-icon">📝</span>Posts</button>
<button class="nav-btn" data-screen="reelsScreen"><span class="nav-icon">🎬</span>Reels</button>
<button class="nav-btn" data-screen="friendsScreen"><span class="nav-icon">👥</span>Friends</button>
<button class="nav-btn" data-screen="chatScreen"><span class="nav-icon">💬</span>Chat</button>
<button class="nav-btn" data-screen="profileScreen"><span class="nav-icon">👤</span>Profile</button>
</nav>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,collection,addDoc,query,orderBy,onSnapshot,getDocs,where,updateDoc,serverTimestamp,deleteDoc,arrayUnion,arrayRemove,increment} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBwlV_JfkbnFZ0zJDxDX8SQo0HvADgDjwA",authDomain:"do-dil-ek-jaan.firebaseapp.com",projectId:"do-dil-ek-jaan",storageBucket:"do-dil-ek-jaan.firebasestorage.app",messagingSenderId:"468290989463",appId:"1:468290989463:web:3a8c0fc7b550177cfb68d2"};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app), provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);
let currentPrivateFriendUid=null, postsUnsub=null, reelsUnsub=null, reqUnsub=null, friendsUnsub=null, privateUnsub=null;
let selectedPostBase64=null, selectedReelBase64=null, selectedProfileBase64=null;
const safe=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const code=()=>{const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from({length:8},()=>c[Math.floor(Math.random()*c.length)]).join("")};
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id));document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.screen===id));}
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>showScreen(b.dataset.screen)));
function chatId(a,b){return [a,b].sort().join("_")} function reqId(a,b){return a+"_"+b}
getRedirectResult(auth).catch(()=>{});
$("loginBtn").onclick=async()=>{try{const mob=/Android|iPhone/i.test(navigator.userAgent)||location.hostname.includes("vercel.app"); if(mob) await signInWithRedirect(auth,provider); else await signInWithPopup(auth,provider);}catch{await signInWithRedirect(auth,provider);}};
async function loadProfile(u){const r=doc(db,"users",u.uid);let s=await getDoc(r);if(!s.exists()){await setDoc(r,{name:u.displayName||"User",bio:"",email:u.email||"",photoURL:u.photoURL||"",friendCode:code(),createdAt:serverTimestamp()}); s=await getDoc(r);}const d=s.data(); $("userName").textContent=d.name||"User"; $("userEmail").textContent=u.email||""; $("userBio").textContent=d.bio||"No bio"; $("nameInput").value=d.name||""; $("bioInput").value=d.bio||""; $("profilePic").src=d.photoURL||u.photoURL||"https://placehold.co/100x100/58145b/fff?text=❤"; $("myFriendCode").textContent=d.friendCode||code(); $("homeWelcome").textContent="Welcome, "+(d.name||"User")+"! ❤️";}

// POSTS WITH COMMENTS
$("selectMediaBtn").onclick=()=>$("postMediaInput").click(); $("removeMediaBtn").onclick=()=>{selectedPostBase64=null;$("postMediaInput").value="";$("mediaPreviewImg").style.display="none";$("removeMediaBtn").classList.add("hidden");};
$("postMediaInput").onchange=()=>{const f=$("postMediaInput").files[0]; if(!f)return; if(f.size>700*1024){alert("700KB se chhoti photo lo");return;} const rd=new FileReader(); rd.onload=e=>{selectedPostBase64=e.target.result; $("mediaPreviewImg").src=selectedPostBase64; $("mediaPreviewImg").style.display="block"; $("removeMediaBtn").classList.remove("hidden");}; rd.readAsDataURL(f);};

function loadPosts(){if(postsUnsub)postsUnsub(); postsUnsub=onSnapshot(query(collection(db,"posts"),orderBy("createdAt","desc")),snap=>{
$("postsFeed").innerHTML=""; if(snap.empty){$("postsFeed").innerHTML="<p class=muted>No posts ❤️</p>";return;}
snap.forEach(d=>{
const p=d.data(); const id=d.id; const uid=auth.currentUser?.uid; const liked=uid&&p.likes?.includes(uid);
const el=document.createElement("div"); el.className="post-card";
el.innerHTML=`
<div style="display:flex;justify-content:space-between"><b>❤️ ${safe(p.authorName||"User")}</b> ${uid===p.uid?`<button class="del" style="width:auto;padding:4px 10px;background:#ff3264">🗑️</button>`:""}</div>
<div style="margin:6px 0;white-space:pre-wrap">${safe(p.text||"")}</div>
${p.mediaURL?`<img src="${p.mediaURL}" class="post-media">`:""}
<div class="post-actions"><button class="action-btn likeBtn ${liked?"liked":""}">❤️ ${p.likesCount||0}</button><button class="action-btn secondary commentToggle">💬 ${p.commentsCount||0} Comment</button><button class="action-btn secondary shareBtn">🔗 Share</button></div>
<div class="comments-box"><div class="cList"><p class=small>Loading...</p></div><div style="display:flex;gap:6px;margin-top:8px"><input class="cInput" placeholder="Comment likho..." maxlength="200"><button class="cSend" style="width:60px">Send</button></div></div>
`;
if(uid===p.uid) el.querySelector(".del").onclick=async()=>{if(confirm("Delete?")) await deleteDoc(doc(db,"posts",id));};
el.querySelector(".likeBtn").onclick=async()=>{const ref=doc(db,"posts",id); if(liked) await updateDoc(ref,{likes:arrayRemove(uid),likesCount:increment(-1)}); else await updateDoc(ref,{likes:arrayUnion(uid),likesCount:increment(1)});};
el.querySelector(".shareBtn").onclick=async()=>{const txt=`${p.text||""} - Do Dil Ek Jaan Post by ${p.authorName} ${location.href}`; if(navigator.share){try{await navigator.share({title:"Post",text:txt});}catch{}} else {await navigator.clipboard.writeText(txt); alert("Copied ❤️");}};
const box=el.querySelector(".comments-box"); const cList=el.querySelector(".cList");
el.querySelector(".commentToggle").onclick=()=>{
box.classList.toggle("active");
if(box.classList.contains("active")){
onSnapshot(query(collection(db,"posts",id,"comments"),orderBy("createdAt","asc")),cs=>{
cList.innerHTML=""; if(cs.empty){cList.innerHTML="<p class=small>No comments yet ❤️</p>";return;}
cs.forEach(cd=>{const cm=cd.data(); const div=document.createElement("div"); div.className="comment"; div.innerHTML=`<b>${safe(cm.authorName||"User")}:</b> ${safe(cm.text||"")}`; cList.appendChild(div);});
});
}
};
el.querySelector(".cSend").onclick=async()=>{
const input=el.querySelector(".cInput"); const t=input.value.trim(); if(!t||!uid)return;
const b=el.querySelector(".cSend"); b.disabled=true;
try{await addDoc(collection(db,"posts",id,"comments"),{uid:uid,authorName:$("userName").textContent||"User",text:t,createdAt:serverTimestamp()}); await updateDoc(doc(db,"posts",id),{commentsCount:increment(1)}); input.value="";}catch(e){alert(e.message);} b.disabled=false;
};
$("postsFeed").append(el);
});
});}

$("publishPostBtn").onclick=async()=>{const u=auth.currentUser, t=$("postText").value.trim(); if(!u)return; if(!t&&!selectedPostBase64){$("postStatus").textContent="Text ya photo do ❤️";return;} $("publishPostBtn").disabled=true; try{await addDoc(collection(db,"posts"),{uid:u.uid,authorName:$("userName").textContent||"User",text:t,mediaURL:selectedPostBase64||null,likes:[],likesCount:0,commentsCount:0,createdAt:serverTimestamp()}); $("postText").value=""; selectedPostBase64=null; $("postMediaInput").value=""; $("mediaPreviewImg").style.display="none"; $("removeMediaBtn").classList.add("hidden"); $("postStatus").textContent="Post done ❤️";}catch(e){$("postStatus").textContent=e.message;} $("publishPostBtn").disabled=false;};

// REELS
$("selectReelBtn").onclick=()=>$("reelInput").click(); $("removeReelBtn").onclick=()=>{selectedReelBase64=null;$("reelInput").value="";$("reelPreview").style.display="none";$("removeReelBtn").classList.add("hidden");};
$("reelInput").onchange=()=>{const f=$("reelInput").files[0]; if(!f)return; if(f.size>700*1024){alert("700KB se chhoti reel lo");return;} const rd=new FileReader(); rd.onload=e=>{selectedReelBase64=e.target.result; $("reelPreview").src=selectedReelBase64; $("reelPreview").style.display="block"; $("removeReelBtn").classList.remove("hidden");}; rd.readAsDataURL(f);};
function loadReels(){if(reelsUnsub)reelsUnsub(); reelsUnsub=onSnapshot(query(collection(db,"reels"),orderBy("createdAt","desc")),snap=>{$("reelsFeed").innerHTML=""; if(snap.empty){$("reelsFeed").innerHTML="<p class=muted style=padding:20px>No reels 🎬</p>";return;} snap.forEach(d=>{const r=d.data(); const id=d.id; const uid=auth.currentUser?.uid; const liked=uid&&r.likes?.includes(uid); const disliked=uid&&r.dislikes?.includes(uid); const wrap=document.createElement("div"); wrap.className="reel-item"; wrap.innerHTML=`<video src="${r.mediaURL}" class="reel-video" loop playsinline></video><div class="reel-actions"><button class="reel-action-btn likeBtn" style="${liked?'background:linear-gradient(90deg,#ff3f9f,#a52cff)':''}">❤️<span>${r.likesCount||0}</span></button><button class="reel-action-btn dislikeBtn" style="${disliked?'background:#ff4444':''}">👎<span>${r.dislikesCount||0}</span></button><button class="reel-action-btn commentBtn">💬<span>${r.commentsCount||0}</span></button><button class="reel-action-btn shareBtn">🔗<span>Share</span></button>${uid===r.uid?`<button class="reel-action-btn delBtn" style="background:#ff3264">🗑️</button>`:""}</div><div class="reel-overlay"><b>❤️ ${safe(r.authorName||"User")}</b><div class="small">${safe(r.caption||"")}</div></div><div class="reel-comments"><div style="display:flex;justify-content:space-between"><b>Comments</b><button class="secondary closeCmt" style="width:auto;padding:6px 12px">✕</button></div><div class="commentsList"></div><div style="display:flex;gap:6px;margin-top:8px"><input class="cInput" placeholder="Comment..." maxlength="200"><button class="cSend" style="width:60px">Send</button></div></div>`; const vid=wrap.querySelector("video"); vid.onclick=()=>vid.paused?vid.play():vid.pause(); const obs=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting) vid.play().catch(()=>{}); else vid.pause();});},{threshold:0.5}); obs.observe(wrap); wrap.querySelector(".likeBtn").onclick=async()=>{if(!uid)return; const ref=doc(db,"reels",id); if(liked){await updateDoc(ref,{likes:arrayRemove(uid),likesCount:increment(-1)});} else { if(disliked){await updateDoc(ref,{likes:arrayUnion(uid),likesCount:increment(1),dislikes:arrayRemove(uid),dislikesCount:increment(-1)});} else {await updateDoc(ref,{likes:arrayUnion(uid),likesCount:increment(1)});} }}; wrap.querySelector(".dislikeBtn").onclick=async()=>{if(!uid)return; const ref=doc(db,"reels",id); if(disliked){await updateDoc(ref,{dislikes:arrayRemove(uid),dislikesCount:increment(-1)});} else { if(liked){await updateDoc(ref,{dislikes:arrayUnion(uid),dislikesCount:increment(1),likes:arrayRemove(uid),likesCount:increment(-1)});} else {await updateDoc(ref,{dislikes:arrayUnion(uid),dislikesCount:increment(1)});} }}; wrap.querySelector(".shareBtn").onclick=async()=>{const txt=`Reel by ${r.authorName}: ${r.caption||""} ${location.href}`; if(navigator.share){try{await navigator.share({title:"Reel",text:txt});}catch{}} else {await navigator.clipboard.writeText(txt); alert("Copied ❤️");}}; const box=wrap.querySelector(".reel-comments"); const list=wrap.querySelector(".commentsList"); wrap.querySelector(".commentBtn").onclick=()=>{box.classList.add("active"); vid.pause(); onSnapshot(query(collection(db,"reels",id,"comments"),orderBy("createdAt","asc")),cs=>{list.innerHTML=""; if(cs.empty){list.innerHTML="<p class=small>No comments ❤️</p>";return;} cs.forEach(cd=>{const cm=cd.data(); const div=document.createElement("div"); div.className="comment"; div.innerHTML=`<b>${safe(cm.authorName||"User")}:</b> ${safe(cm.text||"")}`; list.appendChild(div);});});}; wrap.querySelector(".closeCmt").onclick=()=>{box.classList.remove("active"); vid.play().catch(()=>{});}; wrap.querySelector(".cSend").onclick=async()=>{const input=wrap.querySelector(".cInput"); const t=input.value.trim(); if(!t||!uid)return; const b=wrap.querySelector(".cSend"); b.disabled=true; try{await addDoc(collection(db,"reels",id,"comments"),{uid:uid,authorName:$("userName").textContent||"User",text:t,createdAt:serverTimestamp()}); await updateDoc(doc(db,"reels",id),{commentsCount:increment(1)}); input.value="";}catch(e){alert(e.message);} b.disabled=false;}; if(uid===r.uid){wrap.querySelector(".delBtn").onclick=async()=>{if(confirm("Delete reel?")) await deleteDoc(doc(db,"reels",id));};} $("reelsFeed").append(wrap);});});}
$("publishReelBtn").onclick=async()=>{const u=auth.currentUser, cap=$("reelCaption").value.trim(); if(!u||!selectedReelBase64){$("reelStatus").textContent="Reel select karo 🎬";return;} $("publishReelBtn").disabled=true; try{await addDoc(collection(db,"reels"),{uid:u.uid,authorName:$("userName").textContent||"User",caption:cap,mediaURL:selectedReelBase64,likes:[],dislikes:[],likesCount:0,dislikesCount:0,commentsCount:0,createdAt:serverTimestamp()}); $("reelCaption").value=""; selectedReelBase64=null; $("reelInput").value=""; $("reelPreview").style.display="none"; $("reelStatus").textContent="Reel uploaded ❤️";}catch(e){$("reelStatus").textContent=e.message;} $("publishReelBtn").disabled=false;};
$("copyCodeBtn").onclick=async()=>{await navigator.clipboard.writeText($("myFriendCode").textContent); $("copyCodeBtn").textContent="Copied ❤️"; setTimeout(()=>$("copyCodeBtn").textContent="Copy Code",1200);};
$("searchFriendBtn").onclick=async()=>{const c=$("friendSearchInput").value.trim().toUpperCase(), me=auth.currentUser; if(c.length!==8)return; $("friendResult").textContent="Searching..."; const snap=await getDocs(query(collection(db,"users"),where("friendCode","==",c))); if(snap.empty){$("friendResult").textContent="Not found";return;} const f=snap.docs[0]; if(f.id===me.uid){$("friendResult").textContent="Own code";return;} $("friendResult").innerHTML=`<div class=friend-card><b>${safe(f.data().name||"User")}</b><br><button id=addF>➕ Add</button></div>`; $("addF").onclick=async()=>{await setDoc(doc(db,"friendRequests",reqId(me.uid,f.id)),{fromUid:me.uid,toUid:f.id,fromName:$("userName").textContent,fromPhoto:$("profilePic").src,status:"pending",createdAt:serverTimestamp()}); $("friendResult").textContent="Sent ❤️";};};
function loadRequests(u){if(reqUnsub)reqUnsub(); reqUnsub=onSnapshot(query(collection(db,"friendRequests"),where("toUid","==",u.uid),where("status","==","pending")),s=>{$("requestList").innerHTML=""; if(s.empty){$("requestList").textContent="No requests";return;} s.forEach(d=>{const rd=d.data(); const el=document.createElement("div"); el.className="request-card"; el.innerHTML=`<b>${safe(rd.fromName||"User")}</b><div style="display:flex;gap:6px;margin-top:6px"><button class=accept>Accept</button><button class="secondary reject">Reject</button></div>`; el.querySelector(".accept").onclick=async()=>{await updateDoc(doc(db,"friendRequests",d.id),{status:"accepted"}); await setDoc(doc(db,"friends",u.uid+"_"+rd.fromUid),{uid:u.uid,friendUid:rd.fromUid,friendName:rd.fromName,createdAt:serverTimestamp()}); await setDoc(doc(db,"friends",rd.fromUid+"_"+u.uid),{uid:rd.fromUid,friendUid:u.uid,friendName:$("userName").textContent,createdAt:serverTimestamp()});}; el.querySelector(".reject").onclick=async()=>await updateDoc(doc(db,"friendRequests",d.id),{status:"rejected"}); $("requestList").append(el);});});}
function loadFriends(u){if(friendsUnsub)friendsUnsub(); friendsUnsub=onSnapshot(query(collection(db,"friends"),where("uid","==",u.uid)),s=>{$("friendsList").innerHTML=""; s.forEach(d=>{const fd=d.data(); const el=document.createElement("div"); el.className="friend-card"; el.innerHTML=`<b>${safe(fd.friendName||"Friend")}</b><br><button style="margin-top:6px">💬 Message</button>`; el.querySelector("button").onclick=()=>openChat(fd.friendUid,fd.friendName); $("friendsList").append(el);});});}
async function openChat(fid,fname){const u=auth.currentUser; currentPrivateFriendUid=fid; $("privateFriendName").textContent=fname; $("privateChatHeader").classList.remove("hidden"); showScreen("chatScreen"); const id=chatId(u.uid,fid); await setDoc(doc(db,"privateChats",id),{participants:[u.uid,fid]},{merge:true}); if(privateUnsub)privateUnsub(); privateUnsub=onSnapshot(query(collection(db,"privateChats",id,"messages"),orderBy("createdAt","asc")),snap=>{$("chatBox").innerHTML=""; snap.forEach(m=>{const d=m.data(); const div=document.createElement("div"); div.style.margin="6px 0"; div.style.textAlign=d.uid===u.uid?"right":"left"; div.innerHTML=`<span style="display:inline-block;padding:8px 12px;border-radius:14px;background:${d.uid===u.uid?"#ff3f9f":"#ffffff20"}">${safe(d.text||"")}</span>`; $("chatBox").append(div);}); $("chatBox").scrollTop=$("chatBox").scrollHeight;});}
$("sendBtn").onclick=async()=>{const u=auth.currentUser, t=$("chatInput").value.trim(); if(!u||!currentPrivateFriendUid||!t)return; const id=chatId(u.uid,currentPrivateFriendUid); await addDoc(collection(db,"privateChats",id,"messages"),{uid:u.uid,text:t,createdAt:serverTimestamp()}); $("chatInput").value="";};
$("backToFriendsBtn").onclick=()=>showScreen("friendsScreen");
$("changePhotoBtn").onclick=()=>$("photoInput").click(); $("photoInput").onchange=()=>{const f=$("photoInput").files[0]; if(!f)return; if(f.size>500*1024){alert("500KB se chhoti lo");return;} const rd=new FileReader(); rd.onload=e=>{selectedProfileBase64=e.target.result; $("profilePreview").src=selectedProfileBase64; $("profilePreview").style.display="block"; $("uploadPhotoBtn").classList.remove("hidden");}; rd.readAsDataURL(f);};
$("uploadPhotoBtn").onclick=async()=>{const u=auth.currentUser; if(!u||!selectedProfileBase64)return; await setDoc(doc(db,"users",u.uid),{photoURL:selectedProfileBase64},{merge:true}); $("profilePic").src=selectedProfileBase64; $("profilePreview").style.display="none"; $("uploadPhotoBtn").classList.add("hidden");};
$("editBtn").onclick=()=>$("editBox").classList.remove("hidden"); $("cancelBtn").onclick=()=>$("editBox").classList.add("hidden"); $("saveBtn").onclick=async()=>{const u=auth.currentUser; const n=$("nameInput").value.trim(); const b=$("bioInput").value.trim(); if(!n)return; await setDoc(doc(db,"users",u.uid),{name:n,bio:b},{merge:true}); $("userName").textContent=n; $("userBio").textContent=b; $("editBox").classList.add("hidden");}; $("logoutBtn").onclick=async()=>await signOut(auth);
onAuthStateChanged(auth,async u=>{if(u){$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden"); await loadProfile(u); loadPosts(); loadReels(); loadRequests(u); loadFriends(u);} else {$("app").classList.add("hidden");$("loginScreen").classList.remove("hidden");}});
</script>
</body>
</html>
