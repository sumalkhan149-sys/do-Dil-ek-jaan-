<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do Dil Ek Jaan ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #58145b, #180018 55%, #050005);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 45px rgba(255,0,150,.25);
    }

    .logo {
      font-size: 65px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
      background: linear-gradient(90deg,#ff6bcb,#fff,#ff4f9a);
      -webkit-background-clip: text;
      color: transparent;
    }

    p {
      color: #e8d2e6;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg,#ff3f9f,#a52cff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .profile {
      display: none;
    }

    .profile img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin: 15px;
      border: 3px solid #ff70c8;
    }

    .logout {
      margin-top: 15px;
      background: rgba(255,255,255,.12);
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
      <div class="logo">❤️</div>

      <h1>Do Dil Ek Jaan</h1>

      <p>Connect • Chat • Share • Play</p>

      <button id="loginBtn">
        Continue with Google
      </button>
    </div>


    <!-- PROFILE SCREEN -->
    <div id="profileScreen" class="profile">

      <div class="logo">💕</div>

      <h1>Welcome!</h1>

      <img id="profilePic" src="" alt="Profile">

      <h2 id="userName"></h2>

      <p id="userEmail"></p>

      <button id="logoutBtn" class="logout">
        Logout
      </button>

    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    // 🔥 APNI FIREBASE CONFIG YAHAN PASTE KARO

    const firebaseConfig = {

      apiKey: "AIzaSyBwlV_JfkbnFZ0zJDxDX8SQo0HvADgDjwA",

      authDomain: "do-dil-ek-jaan.firebaseapp.com",

      projectId: "do-dil-ek-jaan",

      storageBucket: "do-dil-ek-jaan.firebasestorage.app",

      messagingSenderId: "468290989463",

      appId: "1:468290989463:web:3a8c0fc7b550177cfb68d2"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    const loginScreen =
      document.getElementById("loginScreen");

    const profileScreen =
      document.getElementById("profileScreen");

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const userName =
      document.getElementById("userName");

    const userEmail =
      document.getElementById("userEmail");

    const profilePic =
      document.getElementById("profilePic");


    // GOOGLE LOGIN

    loginBtn.addEventListener("click", async () => {

      try {

        await signInWithPopup(auth, provider);

      } catch (error) {

        alert("Login failed: " + error.message);

        console.log(error);

      }

    });


    // CHECK LOGIN

    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginScreen.style.display = "none";

        profileScreen.style.display = "block";

        userName.textContent =
          user.displayName || "Do Dil Ek Jaan User";

        userEmail.textContent =
          user.email || "";

        profilePic.src =
          user.photoURL ||
          "https://via.placeholder.com/90";

      } else {

        loginScreen.style.display = "block";

        profileScreen.style.display = "none";

      }

    });


    // LOGOUT

    logoutBtn.addEventListener("click", async () => {

      await signOut(auth);

    });

  </script>

</body>
</html>
